requires_purifier_frozen: true
requires_purified_dataset_on_disk: true
forbid_joint_training: true
protocols:
  fixed_clean_trained:
    train: clean_train
    validation: clean_validation
    evaluate:
      - clean_test
      - defended_test
      - purified_test
  defended_only_adaptive:
    train: defended_train
    validation: defended_validation
    evaluate:
      - defended_test
      - purified_test
  purified_adaptive:
    train: purified_train
    validation: purified_validation
    evaluate:
      - purified_test
sanity_checks:
  - identity_baseline
  - clean_upper_bound
  - shuffled_condition
  - zero_condition
  - unconditional_diffusion
  - test_label_oracle_scan
